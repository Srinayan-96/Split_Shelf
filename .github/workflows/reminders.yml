name: Daily reminders

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 India time
  workflow_dispatch:        # also lets you run it by hand from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.API_URL }}
        run: |
          # A sleeping free-tier server needs a while to wake up, so we are patient and retry.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/api/jobs/reminders" \
            -H "x-cron-secret: $CRON_SECRET"
